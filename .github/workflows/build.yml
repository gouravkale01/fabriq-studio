name: Build Fabriq Studio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Project Files
      run: |
        mkdir -p app/src/main/java/com/fabriq/promptstudio/data/local
        mkdir -p app/src/main/java/com/fabriq/promptstudio/data/repository
        mkdir -p app/src/main/java/com/fabriq/promptstudio/di
        mkdir -p app/src/main/java/com/fabriq/promptstudio/domain
        mkdir -p app/src/main/java/com/fabriq/promptstudio/ui

        echo "" | base64 -d > settings.gradle.kts

        echo "cGx1Z2lucyB7CiAgICBpZCgiY29tLmFuZHJvaWQuYXBwbGljYXRpb24iKSB2ZXJzaW9uICI4LjUuMiIgYXBwbHkgZmFsc2UKICAgIGlkKCJvcmcuamV0YnJhaW5zLmtvdGxpbi5hbmRyb2lkIikgdmVyc2lvbiAiMS45LjI0IiBhcHBseSBmYWxzZQogICAgaWQoImNvbS5nb29nbGUuZGFnZ2VyLmhpbHQuYW5kcm9pZCIpIHZlcnNpb24gIjIuNTEuMSIgYXBwbHkgZmFsc2UKfQ==" | base64 -d > build.gradle.kts

        echo "b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVl" | base64 -d > gradle.properties

        echo "" | base64 -d > app/build.gradle.kts

        echo "" | base64 -d > app/src/main/AndroidManifest.xml

        echo "cGFja2FnZSBjb20uZmFicmlxLnByb21wdHN0dWRpbwoKaW1wb3J0IGFuZHJvaWQuYXBwLkFwcGxpY2F0aW9uCmltcG9ydCBkYWdnZXIuaGlsdC5hbmRyb2lkLkhpbHRBbmRyb2lkQXBwCgpASGlsdEFuZHJvaWRBcHAKY2xhc3MgRmFicmlxQXBwIDogQXBwbGljYXRpb24oKQ==" | base64 -d > app/src/main/java/com/fabriq/promptstudio/FabriqApp.kt

        echo "" | base64 -d > app/src/main/java/com/fabriq/promptstudio/MainActivity.kt

        echo "" | base64 -d > app/src/main/java/com/fabriq/promptstudio/data/local/SavedPrompt.kt

        echo "" | base64 -d > app/src/main/java/com/fabriq/promptstudio/data/local/AppDatabase.kt

        echo "" | base64 -d > app/src/main/java/com/fabriq/promptstudio/data/repository/PromptRepository.kt

        echo "" | base64 -d > app/src/main/java/com/fabriq/promptstudio/di/AppModule.kt

        echo "" > /dev/null || true

    - name: Download Precompiled Single-Source App
      run: |
        curl -sL "https://gist.githubusercontent.com/grvdotcom/7cf62b781a7b827cb6e65df6ebae4883/raw/PromptApp.kt" -o app/src/main/java/com/fabriq/promptstudio/PromptApp.kt || true
        # If gist is empty, fallback to writing a robust self-contained file
        cat << 'EOF' > app/src/main/java/com/fabriq/promptstudio/PromptApp.kt
        package com.fabriq.promptstudio

        import android.app.Application
        import android.os.Bundle
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.*
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.platform.LocalClipboardManager
        import androidx.compose.ui.text.AnnotatedString
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import dagger.hilt.android.AndroidEntryPoint
        import dagger.hilt.android.HiltAndroidApp

        @HiltAndroidApp
        class FabriqApp : Application()

        @AndroidEntryPoint
        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    MaterialTheme {
                        Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                            FabriqStudioScreen()
                        }
                    }
                }
            }
        }

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun FabriqStudioScreen() {
            var selectedGarment by remember { mutableStateOf("Kurti Set") }
            var selectedModel by remember { mutableStateOf("Indian Female, 20s") }
            var selectedScene by remember { mutableStateOf("Luxury Boutique Studio") }
            var selectedRatio by remember { mutableStateOf("4:5") }
            var generatedPrompt by remember { mutableStateOf("") }
            val clipboard = LocalClipboardManager.current

            val garments = listOf("Kurti Set", "Designer Saree", "Anarkali Suit", "Oversized T-Shirt", "Maxi Dress")
            val models = listOf("Indian Female, 20s", "Indian Male, Athletic", "International Female")
            val scenes = listOf("Luxury Boutique Studio", "Clean White Infinity", "Aesthetic Cafe")
            val ratios = listOf("4:5 (Post)", "9:16 (Story)", "1:1 (Square)")

            Scaffold(
                topBar = {
                    TopAppBar(title = { Text("Fabriq Studio", fontWeight = FontWeight.Bold) })
                }
            ) { padding ->
                Column(
                    modifier = Modifier
                        .padding(padding)
                        .fillMaxSize()
                        .verticalScroll(rememberScrollState())
                        .padding(16.dp),
                    verticalArrangement = Arrangement.spacedBy(16.dp)
                ) {
                    Text("1. Garment Type", fontWeight = FontWeight.Bold)
                    Row(modifier = Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        garments.forEach { g ->
                            FilterChip(selected = selectedGarment == g, onClick = { selectedGarment = g }, label = { Text(g) })
                        }
                    }

                    Text("2. Model Selection", fontWeight = FontWeight.Bold)
                    Row(modifier = Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        models.forEach { m ->
                            FilterChip(selected = selectedModel == m, onClick = { selectedModel = m }, label = { Text(m) })
                        }
                    }

                    Text("3. Photoshoot Scene", fontWeight = FontWeight.Bold)
                    Row(modifier = Modifier.horizontalScroll(rememberScrollState()), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        scenes.forEach { s ->
                            FilterChip(selected = selectedScene == s, onClick = { selectedScene = s }, label = { Text(s) })
                        }
                    }

                    Text("4. Aspect Ratio", fontWeight = FontWeight.Bold)
                    Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                        ratios.forEach { r ->
                            val cleanR = r.substringBefore(" ")
                            FilterChip(selected = selectedRatio == cleanR, onClick = { selectedRatio = cleanR }, label = { Text(r) })
                        }
                    }

                    Button(
                        onClick = {
                            generatedPrompt = "Editorial fashion catalog photoshoot, $selectedModel wearing the uploaded reference $selectedGarment, setting in $selectedScene, soft diffused studio light, sharp fabric weaves and drape, 8k --ar $selectedRatio --style raw --v 6.1"
                        },
                        modifier = Modifier.fillMaxWidth().height(52.dp),
                        shape = RoundedCornerShape(12.dp)
                    ) {
                        Text("Generate Prompt", fontWeight = FontWeight.Bold)
                    }

                    if (generatedPrompt.isNotEmpty()) {
                        Card(modifier = Modifier.fillMaxWidth()) {
                            Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                Text("Generated AI Prompt:", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                                Text(generatedPrompt, fontSize = 13.sp)
                                Button(onClick = { clipboard.setText(AnnotatedString(generatedPrompt)) }) {
                                    Text("Copy Prompt")
                                }
                            }
                        }
                    }
                }
            }
        }
        EOF

    - name: Build Debug APK
      run: |
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FabriqStudio-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
