name: Build Fabriq Studio APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Project Files
      run: |
        cat << 'EOF' > make_app.py
        import os

        files = {
            "settings.gradle": 'rootProject.name = "FabriqStudio"\ninclude(":app")',
            "build.gradle": 'buildscript {\n repositories { google(); mavenCentral() }\n dependencies { classpath "com.android.tools.build:gradle:8.2.2" }\n}\nallprojects { repositories { google(); mavenCentral() } }',
            "gradle.properties": 'android.useAndroidX=true',
            "app/build.gradle": '''apply plugin: "com.android.application"
        android {
            namespace "com.fabriq.promptstudio"
            compileSdk 34
            defaultConfig {
                applicationId "com.fabriq.promptstudio"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation "androidx.appcompat:appcompat:1.6.1"
            implementation "com.google.android.material:material:1.11.0"
        }''',
            "app/src/main/AndroidManifest.xml": '''<?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:label="Fabriq Studio"
                android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
            </application>
        </manifest>''',
            "app/src/main/res/layout/activity_main.xml": '''<?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:padding="16dp">
            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="vertical">
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Fabriq Prompt Studio"
                    android:textSize="22sp"
                    android:textStyle="bold"
                    android:textColor="#000000"
                    android:layout_marginBottom="16dp"/>
                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Enter Garment Type (e.g. Kurti, Saree, Hoodie):"
                    android:textStyle="bold"/>
                <EditText
                    android:id="@+id/etGarment"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:hint="Silk Saree / Cotton Kurti"
                    android:layout_marginBottom="12dp"/>
                <Button
                    android:id="@+id/btnGenerate"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:text="Generate Prompts"
                    android:layout_marginBottom="16dp"/>
                <TextView
                    android:id="@+id/tvResult"
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:textSize="14sp"
                    android:textColor="#333333"
                    android:textIsSelectable="true"/>
            </LinearLayout>
        </ScrollView>''',
            "app/src/main/java/com/fabriq/promptstudio/MainActivity.java": '''package com.fabriq.promptstudio;

        import android.os.Bundle;
        import android.view.View;
        import android.widget.Button;
        import android.widget.EditText;
        import android.widget.TextView;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main);

                EditText etGarment = findViewById(R.id.etGarment);
                Button btnGenerate = findViewById(R.id.btnGenerate);
                TextView tvResult = findViewById(R.id.tvResult);

                btnGenerate.setOnClickListener(new View.OnClickListener() {
                    @Override
                    public void onClick(View v) {
                        String g = etGarment.getText().toString().trim();
                        if (g.isEmpty()) g = "designer garment";
                        String prompt = "MIDJOURNEY v6.1 PROMPT:\\n" +
                                "High-end commercial catalog photoshoot, Indian female model wearing the uploaded " + g +
                                ", luxury boutique studio setting, soft diffused lighting, 50mm portrait lens, ultra-realistic fabric weave --ar 4:5 --style raw\\n\\n" +
                                "GEMINI / CHATGPT PROMPT:\\n" +
                                "Create a photorealistic studio catalog image of an Indian woman wearing the exact " + g +
                                " shown in the reference photo. Preserve accurate stitching, drape, and texture.";
                        tvResult.setText(prompt);
                    }
                });
            }
        }'''
        }

        for path, content in files.items():
            os.makedirs(os.path.dirname(path), exist_ok=True)
            with open(path, "w") as f:
                f.write(content)
        EOF
        python3 make_app.py

    - name: Compile APK
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Output
      uses: actions/upload-artifact@v4
      with:
        name: FabriqStudio-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
