name: Build Fabriq Studio APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Source Code
      run: |
        python3 -c "
        import os

        files = {
            'settings.gradle.kts': '''pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = \"FabriqPromptStudio\"
        include(\":app\")''',

            'build.gradle.kts': '''plugins {
            id(\"com.android.application\") version \"8.5.2\" apply false
            id(\"org.jetbrains.kotlin.android\") version \"1.9.24\" apply false
            id(\"com.google.dagger.hilt.android\") version \"2.51.1\" apply false
        }''',

            'gradle.properties': '''org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true''',

            'app/build.gradle.kts': '''plugins {
            id(\"com.android.application\")
            id(\"org.jetbrains.kotlin.android\")
            id(\"kotlin-kapt\")
            id(\"com.google.dagger.hilt.android\")
        }
        android {
            namespace = \"com.fabriq.promptstudio\"
            compileSdk = 35
            defaultConfig {
                applicationId = \"com.fabriq.promptstudio\"
                minSdk = 24
                targetSdk = 35
                versionCode = 1
                versionName = \"1.0.0\"
                vectorDrawables { useSupportLibrary = true }
            }
            buildFeatures { compose = true }
            composeOptions { kotlinCompilerExtensionVersion = \"1.5.14\" }
        }
        dependencies {
            implementation(platform(\"androidx.compose:compose-bom:2024.09.00\"))
            implementation(\"androidx.compose.ui:ui\")
            implementation(\"androidx.compose.ui:ui-graphics\")
            implementation(\"androidx.compose.ui:ui-tooling-preview\")
            implementation(\"androidx.compose.material3:material3\")
            implementation(\"androidx.compose.material:material-icons-extended\")
            implementation(\"androidx.core:core-ktx:1.13.1\")
            implementation(\"androidx.lifecycle:lifecycle-runtime-ktx:2.8.5\")
            implementation(\"androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5\")
            implementation(\"androidx.activity:activity-compose:1.9.2\")
            implementation(\"androidx.room:room-runtime:2.6.1\")
            implementation(\"androidx.room:room-ktx:2.6.1\")
            kapt(\"androidx.room:room-compiler:2.6.1\")
            implementation(\"com.google.dagger:hilt-android:2.51.1\")
            kapt(\"com.google.dagger:hilt-compiler:2.51.1\")
            implementation(\"androidx.hilt:hilt-navigation-compose:1.2.0\")
        }''',

            'app/src/main/AndroidManifest.xml': '''<?xml version=\"1.0\" encoding=\"utf-8\"?>
        <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">
            <application
                android:name=\".FabriqApp\"
                android:allowBackup=\"true\"
                android:icon=\"@android:drawable/sym_def_app_icon\"
                android:label=\"Fabriq Studio\"
                android:supportsRtl=\"true\"
                android:theme=\"@android:style/Theme.Material.Light.NoActionBar\">
                <activity android:name=\".MainActivity\" android:exported=\"true\" android:windowSoftInputMode=\"adjustResize\">
                    <intent-filter>
